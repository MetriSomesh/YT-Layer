name: Build and Push Docker Image

on:
  push:
    branches: [ "Main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Convert repo name to lowercase
      id: repo_name
      run: |
        echo "image=ghcr.io/${{ github.repository_owner }}/yt-layer" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ steps.repo_name.outputs.image }}:latest
          ${{ steps.repo_name.outputs.image }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    - name: Zero-Downtime Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "=== 1. Pulling fresh image ==="
          docker pull ghcr.io/metrisomesh/yt-layer:latest

          echo "=== 2. Updating Replica 1 (Port 3000) ==="
          docker stop yt-layer && docker rm yt-layer
          docker run -d \
            --name yt-layer \
            --restart unless-stopped \
            -p 127.0.0.1:3000:3000 \
            --env-file ~/app.env \
            ghcr.io/metrisomesh/yt-layer:latest

          # Wait for Replica 1 to stabilize
          sleep 5

          echo "=== 3. Updating Replica 2 (Port 3001) ==="
          docker stop yt-layer-2 && docker rm yt-layer-2
          docker run -d \
            --name yt-layer-2 \
            --restart unless-stopped \
            -p 127.0.0.1:3001:3000 \
            --env-file ~/app.env \
            ghcr.io/metrisomesh/yt-layer:latest

          echo "=== 4. Cleaning up old images ==="
          docker image prune -f

          echo "Deployment complete and zero downtime maintained!"
