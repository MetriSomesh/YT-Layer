name: Node.js CI

on:
  push:
    branches: [ "main" ]    # Check if your default branch is "main" or "Main"
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]    # Node 20 matches your project's engine specification

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Run Linter
      run: npm run lint

    - name: Build Project
      run: npm run build
      env:
        # Dummy DB URL allows Prisma schema validation to succeed during Next.js build
        DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy?sslmode=require"
